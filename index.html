<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Roster | Player Stats</title>
<style>
:root{
  --bg:#080d14; --panel:#111a26; --panel2:#172333; --line:#2a394b;
  --text:#f4f7fb; --muted:#a7b4c5; --accent:#d72e3f; --accent2:#ff5262;
  --good:#8bd3b0; --radius:16px;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#152336 0%,var(--bg) 55%);color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.45}
.shell{max-width:1120px;margin:0 auto;padding:36px 20px 60px}
.topline{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.78rem;letter-spacing:.16em;text-transform:uppercase}
.mark{width:10px;height:10px;background:var(--accent);border-radius:2px;box-shadow:0 0 18px #d72e3f80}
h1{font-size:clamp(2rem,5vw,3.6rem);line-height:1.02;letter-spacing:-.04em;margin:16px 0 10px}
.lead{color:var(--muted);max-width:650px;margin:0 0 28px}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0 18px}
.search{flex:1;min-width:210px;background:#0d1520;border:1px solid var(--line);color:var(--text);padding:13px 15px;border-radius:11px;font:inherit;outline:none}
.search:focus{border-color:var(--accent2);box-shadow:0 0 0 3px #d72e3f25}
.filter{background:#0d1520;border:1px solid var(--line);color:var(--text);padding:12px;border-radius:11px;font:inherit}
.summary{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:.88rem;margin:0 2px 10px}
.roster{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#0d141e}
.roster-head,.player-row{display:grid;grid-template-columns:70px minmax(180px,1.6fr) minmax(65px,.5fr) repeat(3,minmax(58px,.55fr)) 28px;align-items:center;gap:12px}
.roster-head{padding:12px 18px;background:#121d2a;color:#8292a6;font-size:.7rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.player{border-top:1px solid #202d3c}
.player:first-of-type{border-top:0}
.player-row{padding:13px 18px;cursor:pointer;transition:background .15s;outline:none}
.player-row:hover,.player-row:focus-visible{background:#152234}
.player-row[aria-expanded="true"]{background:#192638}
.number{font-weight:800;color:#93a4b8;font-variant-numeric:tabular-nums}
.identity{display:flex;align-items:center;gap:12px;min-width:0}
.avatar{width:44px;height:44px;flex:0 0 44px;border-radius:50%;object-fit:cover;background:linear-gradient(145deg,#26384d,#111a26);border:1px solid #3b4b5f}
.avatar-fallback{display:grid;place-items:center;font-weight:900;color:#e3eaf3}
.name{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:.77rem;color:var(--muted);margin-top:2px}
.pos{font-size:.8rem;color:#c9d4e2;background:#1c2a3b;border:1px solid #2b3b4e;border-radius:6px;padding:4px 7px;justify-self:start}
.stat{font-variant-numeric:tabular-nums;font-weight:650}
.chevron{color:#9eacbc;transition:transform .2s;font-size:1.15rem;text-align:center}
.player-row[aria-expanded="true"] .chevron{transform:rotate(180deg);color:var(--accent2)}
.details{padding:0 18px 20px;background:linear-gradient(180deg,#192638,#111a26);border-top:1px solid #28394c}
.details-inner{display:grid;grid-template-columns:minmax(180px,.7fr) minmax(0,2fr);gap:22px;padding-top:20px}
.profile{display:flex;gap:15px;align-items:flex-start}
.profile-photo{width:104px;height:124px;border-radius:12px;object-fit:cover;background:#26384d;border:1px solid #3a4b60}
.profile h2{font-size:1.45rem;margin:2px 0 4px;line-height:1.1}
.meta{font-size:.86rem;color:var(--muted);margin:0 0 8px}
.bio{color:#d4dce7;font-size:.9rem;margin:12px 0 0}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pill{border:1px solid #34465a;background:#101a27;color:#c4cfdd;border-radius:7px;padding:5px 8px;font-size:.76rem}
.stat-section h3{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:#9fadc0;margin:0 0 10px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(82px,1fr));gap:8px}
.stat-card{background:#0e1722;border:1px solid #29394c;border-radius:10px;padding:11px 12px;min-width:0}
.stat-label{color:#94a4b7;text-transform:uppercase;letter-spacing:.08em;font-size:.68rem;font-weight:800}
.stat-value{font-size:1.35rem;font-weight:850;letter-spacing:-.03em;margin-top:3px;overflow-wrap:anywhere}
.stat-block+.stat-block{margin-top:18px}
.empty{padding:35px 20px;text-align:center;color:var(--muted)}
.footer{margin-top:16px;color:#74859a;font-size:.75rem;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media(max-width:720px){
 .shell{padding:26px 12px 40px}.roster-head{display:none}
 .roster{border-radius:12px}
 .player-row{grid-template-columns:38px minmax(0,1fr) 42px 26px;gap:9px;padding:12px}
 .player-row .hide-mobile{display:none}
 .avatar{width:40px;height:40px;flex-basis:40px}
 .details{padding:0 12px 16px}.details-inner{grid-template-columns:1fr;gap:18px}
 .profile-photo{width:82px;height:100px}
 .summary{font-size:.8rem}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="shell">
  <div class="topline"><span class="mark"></span><span id="teamLabel">TEAM ROSTER</span></div>
  <h1>PLAYER <span style="color:var(--accent2)">ROSTER</span></h1>
  <p class="lead" id="intro">Meet the players. Select a name to explore player bios and statistics.</p>
  <div class="toolbar">
    <input class="search" id="search" type="search" placeholder="Search player, number, or position…" aria-label="Search players">
    <select class="filter" id="positionFilter" aria-label="Filter by position">
      <option value="">All positions</option><option value="F">Forwards</option><option value="D">Defense</option><option value="G">Goalies</option>
    </select>
  </div>
  <div class="summary"><span id="count">Loading roster…</span><span>SELECT A PLAYER TO EXPAND <span style="color:var(--accent2)">↘</span></span></div>
  <section class="roster" id="roster" aria-label="Player roster"></section>
  <div class="footer"><span>PLAYER PROFILES · SEASON & CAREER STATS</span><span>Replace sample data with your roster in <code>players.json</code></span></div>
</main>
<script>
const fallbackPlayers = [
 {id:"player-1",number:9,name:"Alex Morgan",position:"F",shoots:"L",height:"6'0\\"",weight:"185 lb",hometown:"Denver, CO",photo:"",bio:"Two-way forward known for pace, puck protection, and a strong work ethic.",season:{GP:42,G:18,A:24,PTS:42,PIM:16,SOG:112},career:{GP:78,G:29,A:41,PTS:70,PIM:30}},
 {id:"player-2",number:31,name:"Jordan Lee",position:"G",shoots:"L",height:"6'2\\"",weight:"190 lb",hometown:"Madison, WI",photo:"",bio:"Competitive goaltender with quick lateral movement and calm rebound control.",season:{GP:25,W:15,L:7,OTL:3,"SV%":".918",GAA:"2.41"},career:{GP:41,W:24,L:12,OTL:5,"SV%":".914",GAA:"2.56"}},
 {id:"player-3",number:17,name:"Sam Taylor",position:"D",shoots:"R",height:"6'1\\"",weight:"195 lb",hometown:"Boise, ID",photo:"",bio:"Mobile defenseman who moves the puck efficiently and contributes on special teams.",season:{GP:40,G:6,A:19,PTS:25,PIM:28,"+/-":"+12",SOG:74},career:{GP:72,G:10,A:31,PTS:41,PIM:44,"+/-":"+18"}}
];
let players = fallbackPlayers;
let openId = null;
const $ = id => document.getElementById(id);
const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const initials = name => String(name || "?").split(/\s+/).map(x=>x[0]).slice(0,2).join("").toUpperCase();
function avatarMarkup(player, extraClass="avatar"){
  const name = escapeHtml(player.name || "Player");
  if(player.photo) return `<img class="${extraClass}" src="${escapeHtml(player.photo)}" alt="${name}" loading="lazy" onerror="this.onerror=null;this.outerHTML='<div class=&quot;${extraClass} avatar-fallback&quot; aria-label=&quot;No photo available&quot;>${escapeHtml(initials(player.name))}</div>'">`;
  return `<div class="${extraClass} avatar-fallback" aria-label="No photo available">${escapeHtml(initials(player.name))}</div>`;
}
function statCards(stats){
  if(!stats || !Object.keys(stats).length) return '<p class="meta">No stats entered yet.</p>';
  return `<div class="stat-grid">${Object.entries(stats).map(([key,val])=>`<div class="stat-card"><div class="stat-label">${escapeHtml(key)}</div><div class="stat-value">${escapeHtml(val)}</div></div>`).join("")}</div>`;
}
function playerDetails(p){
  const bio = p.bio ? `<p class="bio">${escapeHtml(p.bio)}</p>` : '<p class="bio">Player bio coming soon.</p>';
  const pills = [["Shoots",p.shoots],["Height",p.height],["Weight",p.weight],["Hometown",p.hometown]].filter(x=>x[1]).map(([k,v])=>`<span class="pill">${escapeHtml(k)}: ${escapeHtml(v)}</span>`).join("");
  return `<div class="details" id="details-${escapeHtml(p.id)}"><div class="details-inner">
    <div><div class="profile">${avatarMarkup(p,"profile-photo")}<div><h2>${escapeHtml(p.name)}</h2><p class="meta">#${escapeHtml(p.number)} · ${escapeHtml(p.position || "—")}</p><p class="meta">${escapeHtml(p.hometown || "Hometown not entered")}</p></div></div>${bio}<div class="pills">${pills}</div></div>
    <div><div class="stat-block"><h3>Season statistics</h3>${statCards(p.season)}</div><div class="stat-block"><h3>Career statistics</h3>${statCards(p.career)}</div></div>
  </div></div>`;
}
function render(){
  const query = $("search").value.trim().toLowerCase();
  const pos = $("positionFilter").value;
  const filtered = players.filter(p => (!pos || p.position===pos) && [p.name,p.number,p.position,p.hometown].some(v=>String(v??"").toLowerCase().includes(query)));
  $("count").textContent = `${filtered.length} player${filtered.length===1?"":"s"} shown · ${players.length} total`;
  if(!filtered.length){$("roster").innerHTML='<div class="empty">No players match that search. Try another name or position.</div>';return;}
  $("roster").innerHTML = `<div class="roster-head"><span>#</span><span>Player</span><span>Pos</span><span>GP</span><span>G</span><span>PTS</span><span></span></div>` + filtered.map(p=>{
    const expanded = openId===p.id;
    const s = p.season || {};
    return `<article class="player">
      <div class="player-row" role="button" tabindex="0" aria-expanded="${expanded}" aria-controls="details-${escapeHtml(p.id)}" data-player="${escapeHtml(p.id)}">
        <span class="number">${escapeHtml(p.number ?? "—")}</span>
        <span class="identity">${avatarMarkup(p)}<span style="min-width:0"><span class="name">${escapeHtml(p.name)}</span><span class="sub">${escapeHtml(p.hometown || "Player profile")}</span></span></span>
        <span class="pos">${escapeHtml(p.position || "—")}</span>
        <span class="stat hide-mobile">${escapeHtml(s.GP ?? "—")}</span>
        <span class="stat hide-mobile">${escapeHtml(s.G ?? "—")}</span>
        <span class="stat hide-mobile">${escapeHtml(s.PTS ?? "—")}</span>
        <span class="chevron" aria-hidden="true">⌄</span>
      </div>
      ${expanded ? playerDetails(p) : ""}
    </article>`;
  }).join("");
}
function togglePlayer(id){openId = openId===id ? null : id;render();}
$("roster").addEventListener("click",e=>{const row=e.target.closest("[data-player]");if(row)togglePlayer(row.dataset.player);});
$("roster").addEventListener("keydown",e=>{const row=e.target.closest("[data-player]");if(row&&(e.key==="Enter"||e.key===" ")){e.preventDefault();togglePlayer(row.dataset.player);}});
$("search").addEventListener("input",render);
$("positionFilter").addEventListener("change",render);
fetch("./players.json").then(r=>{if(!r.ok)throw Error("No external roster file");return r.json();}).then(data=>{if(Array.isArray(data)){players=data;render();}}).catch(()=>render());
</script>
</body>
</html>
